# Crawler identity and politeness defaults (spec §5.2).
# The contact page explains the bot and links to a public GitHub issue form
# (no personal email). Keep user_agent in sync with site/src/config.ts.
# Floors (≥3 s interval, 1 connection, ≤20 consecutive errors, robots on) are
# enforced by bxr.config.CrawlerConfig; the code refuses looser values.
user_agent: "BuilderXRayBot/0.1 (+{contact_url}; public RERA records research)"
contact_url: "https://builder-xray.prags-codes.workers.dev/about/crawler/"
min_interval_seconds: 3.0
max_concurrency_per_host: 1
max_consecutive_errors: 20
backoff_base_seconds: 5
backoff_max_seconds: 600
respect_robots_txt: true
timeout_seconds: 30
# Attempts per URL (first try + retries on 429/5xx/timeouts).
max_attempts: 3
# Stop reading a response after this many bytes (some portal pages embed huge maps).
max_body_bytes: 5000000
max_redirects: 5
# Hosts whose /robots.txt returns 401/403 while public pages serve our
# User-Agent normally. RFC 9309 §2.3.1.3 treats an unavailable robots.txt (4xx)
# as "no restrictions"; our default is stricter (401/403 → disallow), so each
# exception needs evidence here. Remove an entry if the site starts refusing pages.
robots_unavailable_allowed_hosts:
  # 2026-11-19: /robots.txt → 403 (Apache) on both hosts; home page → 200 to
  # BuilderXRayBot, no CAPTCHA/login; public project search exists.
  - maharera.maharashtra.gov.in
  - www.maharera.maharashtra.gov.in
# Hosts whose servers need TLS "legacy renegotiation", which OpenSSL 3 refuses
# by default (error UNSAFE_LEGACY_RENEGOTIATION_DISABLED). Enabling it for these
# hosts is client-side compatibility, not getting past access control.
# Certificates are still fully verified. We send no secrets to these hosts.
# Owner approved 2026-11-19.
legacy_tls_hosts:
  - rera.mp.gov.in
  - hira.wb.gov.in
