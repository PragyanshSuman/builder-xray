name: Crawler contact (website operators)
description: Ask BuilderXRayBot to slow down, avoid pages or stop crawling your website.
title: "[Crawler] "
labels: ["crawler-contact"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for getting in touch. We act on crawler requests promptly.
        Please don't include passwords or other secrets; this issue is public.
  - type: input
    id: website
    attributes:
      label: Website / domain
      placeholder: e.g. rera.example.gov.in
    validations:
      required: true
  - type: dropdown
    id: request
    attributes:
      label: What would you like us to do?
      options:
        - Stop crawling this website
        - Crawl more slowly
        - Avoid specific pages or paths
        - Crawl at different hours
        - Something else / question
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Paths, preferred rate or hours, or anything else we should know.
